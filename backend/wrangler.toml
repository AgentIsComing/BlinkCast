name = "blinkcast-signaling"
main = "src/index.ts"
compatibility_date = "2026-08-17"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" },
  { name = "CODES", class_name = "CodeRegistry" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "CodeRegistry"]

[vars]
ROOM_TTL_SECONDS = "900"
